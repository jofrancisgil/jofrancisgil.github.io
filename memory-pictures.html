<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Memory Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Scene Perspective */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
            cursor: pointer;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg);
            animation: matchCelebration 0.6s ease-in-out;
        }

        .card.shake .card-inner {
            animation: mismatchShake 0.4s ease-in-out;
        }

        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Card Back (Default state) */
        .card-back-pattern {
            background-color: #6366f1;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.15) 2px, transparent 2px),
                radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 16px 16px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        /* Card Front (Revealed vocabulary) */
        .card-front-face {
            transform: rotateY(180deg);
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 0 3px #e0e7ff;
        }

        .card.matched .card-front-face {
            box-shadow: 0 0 0 3px #10b981, 0 10px 25px -5px rgba(16, 185, 129, 0.3);
            background: linear-gradient(180deg, #ffffff 70%, #ecfdf5 100%);
        }

        /* Animations */
        @keyframes matchCelebration {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            40% { transform: rotateY(180deg) scale(1.15) rotate(3deg); }
            70% { transform: rotateY(180deg) scale(0.95) rotate(-2deg); }
        }

        @keyframes mismatchShake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            20% { transform: rotateY(180deg) translateX(-6px); }
            40% { transform: rotateY(180deg) translateX(6px); }
            60% { transform: rotateY(180deg) translateX(-4px); }
            80% { transform: rotateY(180deg) translateX(4px); }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        .float-animation {
            animation: floatSlow 6s ease-in-out infinite;
        }

        .hidden-screen {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col items-center justify-center p-4 relative overflow-x-hidden selection:bg-indigo-200">

    <!-- Ambient Floating Gradients -->
    <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-indigo-200/40 blur-3xl pointer-events-none float-animation"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-pink-200/40 blur-3xl pointer-events-none float-animation" style="animation-delay: -3s;"></div>

    <!-- Top Settings Bar -->
    <aside class="fixed top-4 right-4 z-40 flex items-center gap-2">
        <button id="audio-toggle" onclick="toggleAudio()" class="w-11 h-11 bg-white/80 backdrop-blur-md border border-slate-200 shadow-sm rounded-2xl flex items-center justify-center text-lg hover:scale-105 active:scale-95 transition">
            🔊
        </button>
    </aside>

    <!-- Theme Selection View -->
    <main id="theme-selection" class="flex flex-col items-center justify-center w-full max-w-4xl z-10 py-6 transition-all duration-300">
        <nav class="w-full flex justify-start px-4 mb-4">
            <a href="llengues.html" class="inline-flex items-center gap-2 text-indigo-600 font-bold bg-white/90 backdrop-blur-sm px-4 py-2.5 rounded-2xl shadow-sm hover:shadow-md transition hover:-translate-y-0.5 border border-indigo-100/60 text-sm">
                <span>← Back to Llengües</span>
            </a>
        </nav>

        <header class="text-center mb-8 px-4">
            <span class="inline-block px-3.5 py-1.5 rounded-full bg-indigo-50 border border-indigo-200/60 text-indigo-600 text-xs font-bold uppercase tracking-wider mb-2">Language Practice</span>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight">Vocabulary Memory</h1>
            <p class="text-slate-500 mt-2 text-base md:text-lg">Pick a category to flip, listen, and match!</p>
        </header>
        
        <!-- Theme Cards Grid -->
        <section aria-label="Theme categories" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 w-full px-4">
            <!-- Cards populated dynamically with color gradients & badges -->
        </section>
    </main>

    <!-- Game Playing Screen -->
    <main id="game-container" class="w-full max-w-4xl flex flex-col items-center hidden-screen my-auto z-10 transition-all duration-300">
        <header class="w-full mb-6 px-4">
            <div class="flex flex-wrap justify-between items-center gap-3 bg-white/80 backdrop-blur-md p-3 sm:p-4 rounded-3xl border border-slate-200/80 shadow-sm">
                <button onclick="showThemeSelection()" class="text-slate-700 font-semibold text-sm hover:text-indigo-600 flex items-center gap-1.5 px-3 py-2 rounded-xl hover:bg-slate-100 transition active:scale-95">
                    <span>← Themes</span>
                </button>
                
                <h2 id="current-theme-title" class="text-xl sm:text-2xl font-black text-indigo-600 tracking-tight">Theme</h2>

                <div class="flex items-center gap-3">
                    <div class="flex flex-col items-center px-3 py-1 bg-slate-50 rounded-xl border border-slate-200/60 min-w-[70px]">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Time</span>
                        <span id="game-timer" class="text-base sm:text-lg font-bold text-slate-700">00:00</span>
                    </div>
                    <div class="flex flex-col items-center px-3 py-1 bg-slate-50 rounded-xl border border-slate-200/60 min-w-[70px]">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Moves</span>
                        <span id="move-count" class="text-base sm:text-lg font-bold text-indigo-600">0</span>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-200/80 h-2.5 rounded-full mt-3 overflow-hidden p-0.5">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
        </header>

        <!-- Dynamic Card Grid -->
        <div id="game-grid" class="grid gap-3 sm:gap-4 w-full px-2 sm:px-6"></div>

        <button onclick="resetCurrentGame()" class="mt-6 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold py-2.5 px-6 rounded-2xl shadow-sm hover:shadow transition transform active:scale-95 text-sm flex items-center gap-2">
            <span>🔄 Restart Round</span>
        </button>
    </main>

    <!-- Win Modal Dialog -->
    <div id="win-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4 border border-slate-100 transform transition-all scale-100">
            <div id="star-rating" class="text-3xl mb-1 tracking-widest text-amber-400">⭐⭐⭐</div>
            <div class="text-5xl my-3">🏆</div>
            <h2 class="text-2xl font-black text-slate-800">Spectacular!</h2>
            <p class="text-slate-500 text-sm mt-1 mb-6">
                You mastered <span id="completed-theme" class="font-bold text-indigo-600"></span> in 
                <span id="final-moves" class="font-bold text-indigo-600"></span> moves and 
                <span id="final-time" class="font-bold text-indigo-600"></span>!
            </p>

            <div class="flex flex-col gap-2.5">
                <button onclick="closeModalAndRestart()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition">
                    Play Again
                </button>
                <button onclick="closeModalAndMenu()" class="w-full bg-slate-100 text-slate-700 font-bold py-3 rounded-2xl hover:bg-slate-200 active:scale-95 transition">
                    Pick Another Topic
                </button>
            </div>
        </div>
    </div>

    <script>
        const themeConfig = {
            clothes: { emoji: '👕', color: 'from-blue-500 to-indigo-600', border: 'border-blue-200', bg: 'bg-blue-50' },
            weather: { emoji: '☀️', color: 'from-amber-400 to-orange-500', border: 'border-amber-200', bg: 'bg-amber-50' },
            moods: { emoji: '😄', color: 'from-yellow-400 to-amber-500', border: 'border-yellow-200', bg: 'bg-yellow-50' },
            animals: { emoji: '🐕', color: 'from-emerald-400 to-teal-600', border: 'border-emerald-200', bg: 'bg-emerald-50' },
            colours: { emoji: '🎨', color: 'from-pink-500 to-rose-500', border: 'border-pink-200', bg: 'bg-pink-50' },
            fruits: { emoji: '🍎', color: 'from-red-500 to-rose-600', border: 'border-red-200', bg: 'bg-red-50' },
            actions: { emoji: '🏃', color: 'from-purple-500 to-indigo-600', border: 'border-purple-200', bg: 'bg-purple-50' },
            school: { emoji: '🏫', color: 'from-cyan-500 to-blue-600', border: 'border-cyan-200', bg: 'bg-cyan-50' }
        };

        const themes = {
            clothes: [
                { emoji: '👒', name: 'Hat' }, { emoji: '🕶️', name: 'Sunglasses' },
                { emoji: '🧣', name: 'Scarf' }, { emoji: '👕', name: 'T-shirt' },
                { emoji: '🧥', name: 'Jacket' }, { emoji: '👖', name: 'Trousers' },
                { emoji: '🧦', name: 'Socks' }, { emoji: '👟', name: 'Shoes' }
            ],
            weather: [
                { emoji: '☀️', name: 'Sunny' }, { emoji: '🌧️', name: 'Rainy' },
                { emoji: '🥶', name: 'Cold' }, { emoji: '🥵', name: 'Hot' },
                { emoji: '❄️', name: 'Snowy' }, { emoji: '💨', name: 'Windy' }
            ],
            moods: [
                { emoji: '😄', name: 'Happy' }, { emoji: '😢', name: 'Sad' },
                { emoji: '😠', name: 'Angry' }, { emoji: '😴', name: 'Tired' },
                { emoji: '🍽️', name: 'Hungry' }, { emoji: '🥤', name: 'Thirsty' },
                { emoji: '🥳', name: 'Excited' }, { emoji: '😱', name: 'Scared' }
            ],
            animals: [
                { emoji: '🐕', name: 'Dog' }, { emoji: '🐈', name: 'Cat' },
                { emoji: '🐄', name: 'Cow' }, { emoji: '🐑', name: 'Sheep' },
                { emoji: '🐔', name: 'Hen' }, { emoji: '🐎', name: 'Horse' },
                { emoji: '🐖', name: 'Pig' }, { emoji: '🐁', name: 'Mouse' }
            ],
            colours: [
                { emoji: '🟥', name: 'Red' }, { emoji: '🟦', name: 'Blue' },
                { emoji: '🟩', name: 'Green' }, { emoji: '🟨', name: 'Yellow' },
                { emoji: '⬛', name: 'Black' }, { emoji: '⬜', name: 'White' },
                { emoji: '🟧', name: 'Orange' }, { emoji: '🟪', name: 'Purple' }
            ],
            fruits: [
                { emoji: '🍎', name: 'Apple' }, { emoji: '🍌', name: 'Banana' },
                { emoji: '🍊', name: 'Orange' }, { emoji: '🍓', name: 'Strawberry' },
                { emoji: '🍇', name: 'Grapes' }, { emoji: '🍉', name: 'Watermelon' },
                { emoji: '🍐', name: 'Pear' }, { emoji: '🍒', name: 'Cherry' }
            ],
            actions: [
                { emoji: '🏊', name: 'Swimming' }, { emoji: '💃', name: 'Dancing' },
                { emoji: '🍔', name: 'Eating' }, { emoji: '🧃', name: 'Drinking' },
                { emoji: '🛌', name: 'Sleeping' }, { emoji: '🚶', name: 'Walking' },
                { emoji: '🏃', name: 'Running' }, { emoji: '🤸', name: 'Jumping' }
            ],
            school: [
                { emoji: '📐', name: 'Maths' }, { emoji: '🎵', name: 'Music' },
                { emoji: '🌍', name: 'Geography' }, { emoji: '💻', name: 'ICT' },
                { emoji: '🎨', name: 'Art' }, { emoji: '📜', name: 'History' },
                { emoji: '⚽', name: 'PE' }, { emoji: '📚', name: 'English' }
            ]
        };

        let currentThemeKey = '';
        let cardsArray = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard = null;
        let secondCard = null;
        let moves = 0;
        let matchesFound = 0;
        let totalPairs = 0;
        let soundEnabled = true;
        let timerInterval = null;
        let secondsElapsed = 0;

        // Web Audio Synthesizer (Zero asset dependencies)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type = 'sine', duration = 0.1, startTime = 0) {
            if (!soundEnabled || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + startTime);
                osc.stop(audioCtx.currentTime + startTime + duration);
            } catch (e) { /* Audio fallback handling */ }
        }

        function playFlipSound() {
            playTone(420, 'sine', 0.08);
        }

        function playMatchSound() {
            playTone(523.25, 'triangle', 0.15, 0);       // C5
            playTone(659.25, 'triangle', 0.15, 0.1);     // E5
            playTone(783.99, 'triangle', 0.25, 0.2);     // G5
        }

        function playMismatchSound() {
            playTone(280, 'sawtooth', 0.12, 0);
            playTone(220, 'sawtooth', 0.16, 0.1);
        }

        // Web Speech API: Pronounces vocabulary words
        function speakWord(word) {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-GB';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.getElementById('audio-toggle').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Timer Functions
        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('game-timer').innerText = `${mins}:${secs}`;
        }

        // Render Theme Selection Grid
        function renderThemeGrid() {
            const container = document.querySelector('#theme-selection section');
            container.innerHTML = '';

            Object.keys(themes).forEach(key => {
                const conf = themeConfig[key] || { emoji: '🎮', color: 'from-indigo-500 to-purple-600', border: 'border-indigo-200', bg: 'bg-indigo-50' };
                const count = themes[key].length;
                const card = document.createElement('button');
                card.onclick = () => startGame(key);
                card.className = `group bg-white p-5 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-200 flex flex-col items-center justify-between text-center relative overflow-hidden`;

                card.innerHTML = `
                    <div class="w-16 h-16 rounded-2xl ${conf.bg} flex items-center justify-center text-3xl mb-3 group-hover:scale-110 transition duration-200">
                        ${conf.emoji}
                    </div>
                    <div class="font-extrabold text-slate-800 text-base capitalize mb-1">${key}</div>
                    <span class="text-xs font-semibold text-slate-400 bg-slate-100 px-2.5 py-0.5 rounded-full">${count} Pairs</span>
                `;
                container.appendChild(card);
            });
        }

        function startGame(themeKey) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            currentThemeKey = themeKey;
            
            document.getElementById('current-theme-title').innerText = themeKey.charAt(0).toUpperCase() + themeKey.slice(1);
            document.getElementById('theme-selection').classList.add('hidden-screen');
            document.getElementById('game-container').classList.remove('hidden-screen');
            
            initGameLogic();
        }

        function showThemeSelection() {
            stopTimer();
            resetBoard();
            document.getElementById('game-container').classList.add('hidden-screen');
            document.getElementById('theme-selection').classList.remove('hidden-screen');
            document.getElementById('win-modal').classList.add('hidden');
        }

        function resetCurrentGame() {
            initGameLogic();
        }

        function updateProgress() {
            const percentage = (matchesFound / totalPairs) * 100;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function initGameLogic() {
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            moves = 0;
            matchesFound = 0;
            document.getElementById('move-count').innerText = moves;
            document.getElementById('win-modal').classList.add('hidden');
            
            updateProgress();
            startTimer();

            const themeData = themes[currentThemeKey];
            totalPairs = themeData.length;

            let tempArray = [];
            themeData.forEach((item, index) => {
                tempArray.push({ ...item, uniqueId: `pair${index}-1` });
                tempArray.push({ ...item, uniqueId: `pair${index}-2` });
            });

            cardsArray = shuffle(tempArray);

            const gridElement = document.getElementById('game-grid');
            gridElement.className = 'grid gap-3 sm:gap-4 w-full max-w-4xl mx-auto';
            
            if (totalPairs <= 6) { 
                gridElement.classList.add('grid-cols-3', 'md:grid-cols-4');
            } else { 
                gridElement.classList.add('grid-cols-4');
            }

            gridElement.innerHTML = '';
            cardsArray.forEach(item => {
                const card = createCardElement(item);
                gridElement.appendChild(card);
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createCardElement(item) {
            const card = document.createElement('div');
            card.classList.add('card', 'w-full', 'perspective-1000', 'aspect-[4/5]');
            card.dataset.name = item.name;
            
            card.innerHTML = `
                <div class="card-inner">
                    <!-- Face Down (Patterned Back) -->
                    <div class="card-face card-back-pattern border-2 border-white/60">
                        <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-white/90 font-black text-xl shadow-inner">
                            ?
                        </div>
                    </div>
                    
                    <!-- Face Up (Vocabulary Item) -->
                    <div class="card-face card-front-face p-2">
                        <span class="text-4xl sm:text-5xl mb-2 filter drop-shadow-sm select-none">${item.emoji}</span>
                        <span class="text-xs sm:text-sm font-bold text-slate-800 text-center w-full truncate px-1">${item.name}</span>
                    </div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            return card;
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;

            this.classList.add('flipped');
            playFlipSound();
            speakWord(this.dataset.name);

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            document.getElementById('move-count').innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            const isMatch = firstCard.dataset.name === secondCard.dataset.name;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            playMatchSound();
            matchesFound++;
            updateProgress();
            resetBoard();

            if (matchesFound === totalPairs) {
                stopTimer();
                setTimeout(() => {
                    showVictoryScreen();
                }, 600);
            }
        }

        function unflipCards() {
            lockBoard = true;
            playMismatchSound();

            firstCard.classList.add('shake');
            secondCard.classList.add('shake');

            setTimeout(() => {
                if (firstCard) {
                    firstCard.classList.remove('flipped', 'shake');
                }
                if (secondCard) {
                    secondCard.classList.remove('flipped', 'shake');
                }
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function showVictoryScreen() {
            document.getElementById('final-moves').innerText = moves;
            document.getElementById('final-time').innerText = document.getElementById('game-timer').innerText;
            document.getElementById('completed-theme').innerText = currentThemeKey;
            
            // Calculate Stars (3 stars = within 1.5x pairs, 2 stars = 2.2x pairs)
            const starElem = document.getElementById('star-rating');
            if (moves <= totalPairs * 1.4) {
                starElem.innerText = '⭐⭐⭐';
            } else if (moves <= totalPairs * 2.1) {
                starElem.innerText = '⭐⭐';
            } else {
                starElem.innerText = '⭐';
            }

            document.getElementById('win-modal').classList.remove('hidden');
            launchConfetti();
        }

        function closeModalAndRestart() {
            document.getElementById('win-modal').classList.add('hidden');
            resetCurrentGame();
        }
        
        function closeModalAndMenu() {
            document.getElementById('win-modal').classList.add('hidden');
            showThemeSelection();
        }

        function launchConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        // Initialize UI
        renderThemeGrid();
    </script>
</body>
</html>
